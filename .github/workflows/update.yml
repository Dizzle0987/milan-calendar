name: Aggiorna calendario Milan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: milan-calendar-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera calendar.ics
        run: python update_calendar.py

      - name: Salva aggiornamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics data/events.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Aggiorna calendario Milan"
            git push
          fi
